<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Remote Metronome</title>
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="app.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/qr-creator@1.0.0/dist/qr-creator.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
            defer
        ></script>
    </head>
    <body>
        <div class="container" x-data="metronome()">
            <header>
                <div class="room-info">
                    <span class="room-label">Room:</span>
                    <span x-text="roomId" class="room-id"></span>
                    <span
                        x-show="mode === 'remote'"
                        class="mode-indicator remote"
                        >(Remote Control)</span
                    >
                    <button @click="showQrCode()" x-text="qrButtonText">
                        Show QR Code
                    </button>
                </div>
                <div
                    class="connection-status"
                    :class="{ connected: wsConnected }"
                    x-text="connectionStatus"
                >
                    Connecting...
                </div>
            </header>

            <main>
                <div class="metronome-display">
                    <div class="beat-display">
                        <button
                            class="beat-circle"
                            :class="{ active: isPlaying && beatActive }"
                            @click="togglePlay()"
                        >
                            <span
                                class="beat-number"
                                x-html="beatDisplayContent"
                            ></span>
                        </button>
                    </div>

                    <!-- Subdivision display - only visible when subdivisions > 1 and not in remote mode -->
                    <div
                        class="subdivision-display"
                        :class="{ visible: showSubdivisions }"
                        x-show="showSubdivisions && mode !== 'remote'"
                    >
                        <template x-for="i in subdivisionMultiplier" :key="i">
                            <div
                                class="subdivision-circle"
                                :class="{ active: currentSubdivision === (i-1) }"
                            ></div>
                        </template>
                    </div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <div class="tempo-controls">
                            <button class="tempo-btn" @click="adjustBpm(-5)">
                                -5
                            </button>
                            <button class="tempo-btn" @click="adjustBpm(-1)">
                                -
                            </button>
                            <div class="tempo-display" @click="tapTempo()">
                                <span><span x-text="bpm"></span> bpm</span>
                            </div>
                            <button class="tempo-btn" @click="adjustBpm(1)">
                                +
                            </button>
                            <button class="tempo-btn" @click="adjustBpm(5)">
                                +5
                            </button>
                        </div>
                        <input
                            type="range"
                            x-model="bpm"
                            @input="setBpm($event.target.value)"
                            min="40"
                            max="220"
                            class="bpm-slider"
                        />
                    </div>

                    <div class="selector-row">
                        <div class="control-group">
                            <label for="subdivisions">Subdivisions</label>
                            <select
                                id="subdivisions"
                                x-model="subdivisions"
                                @change="setSubdivisions($event.target.value)"
                            >
                                <option value="quarter">Quarter Notes</option>
                                <option value="eighth">8th Notes</option>
                                <option value="sixteenth">16th Notes</option>
                                <option value="triplets">Triplets</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="time-signature">Time Signature</label>
                            <select
                                id="time-signature"
                                x-model="timeSignature"
                                @change="setTimeSignature($event.target.value)"
                            >
                                <option value="2/4">2/4</option>
                                <option value="3/4">3/4</option>
                                <option value="4/4">4/4</option>
                                <option value="6/8">6/8</option>
                                <option value="7/8">7/8</option>
                            </select>
                        </div>
                    </div>
                </div>
            </main>

            <!-- QR Code Modal -->
            <div x-show="showQrModal"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="qr-modal-overlay"
                 @click="closeQrModal()"
                 @keydown.escape="closeQrModal()">

                <div class="qr-modal" @click.stop>
                    <div class="qr-modal-header">
                        <h3>Scan to Connect</h3>
                        <button @click="closeQrModal()" class="qr-close-btn">×</button>
                    </div>

                    <div class="qr-code-container">
                        <img x-bind:src="qrCodeDataUrl" alt="QR Code" class="qr-code" />
                        <div x-show="connectionFeedback" class="connection-success">
                            ✓ New device connected!
                        </div>
                    </div>

                    <div class="qr-modal-footer">
                        <p class="qr-url-text" x-text="wsManager?.generateShareableUrl(mode)"></p>
                        <button @click="copyUrlFromModal()" class="qr-copy-btn" x-text="copyUrlText">Copy URL</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
