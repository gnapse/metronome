<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Metronome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="room-info">
                <span class="room-label">Room:</span>
                <span id="room-id"></span>
                <span id="mode-indicator" class="mode-indicator"></span>
                <button id="copy-link">Copy Link</button>
            </div>
            <div class="connection-status" id="connection-status">Connecting...</div>
        </header>

        <main>
            <div class="metronome-display">
                <div class="beat-display" id="beat-display">
                    <div class="beat-circle" id="beat-circle">
                        <span class="beat-number" id="beat-number">1</span>
                    </div>
                </div>

                <div class="subdivision-display" id="subdivision-display">
                    <div class="subdivision-circle" data-index="0"></div>
                    <div class="subdivision-circle" data-index="1"></div>
                    <div class="subdivision-circle" data-index="2"></div>
                    <div class="subdivision-circle" data-index="3"></div>
                </div>

            </div>

            <div class="controls">

                <div class="control-group">
                    <div class="tempo-controls">
                        <button class="tempo-btn" id="tempo-minus-5">-5</button>
                        <button class="tempo-btn" id="tempo-minus-1">-</button>
                        <div class="tempo-display">
                            <span><span id="bpm-value">120</span> bpm</span>
                        </div>
                        <button class="tempo-btn" id="tempo-plus-1">+</button>
                        <button class="tempo-btn" id="tempo-plus-5">+5</button>
                    </div>
                    <input type="range" id="bpm-slider" min="40" max="220" value="120">
                </div>

                <div class="selector-row">
                    <div class="control-group">
                        <label for="subdivisions">Subdivisions</label>
                        <select id="subdivisions">
                            <option value="quarter" selected>Quarter Notes</option>
                            <option value="eighth">8th Notes</option>
                            <option value="sixteenth">16th Notes</option>
                            <option value="triplets">Triplets</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="time-signature">Time Signature</label>
                        <select id="time-signature">
                            <option value="2/4">2/4</option>
                            <option value="3/4">3/4</option>
                            <option value="4/4" selected>4/4</option>
                            <option value="6/8">6/8</option>
                            <option value="7/8">7/8</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
